<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1424">
<title>COACH LINK 2.0 — платформа тренера</title>
<style>
:root{--bg:#091321;--side:#0d1a2b;--panel:#122238;--panel2:#182b44;--line:#263d59;--txt:#eef5ff;--muted:#91a6c1;--blue:#55a8ff;--green:#39d6a0;--orange:#ffbd68;--red:#ff7180;--shadow:0 16px 45px #0003}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 65% -15%,#1c3b60 0,transparent 40%),var(--bg);color:var(--txt);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0}.shell{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:#0b1727;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px}.logo{font-size:19px;font-weight:950;letter-spacing:.12em;padding:0 10px}.logo span{color:var(--blue)}.workspace{padding:9px 10px;background:#12243a;border:1px solid var(--line);border-radius:13px;color:var(--muted);font-size:12px}.navgroup{display:grid;gap:5px}.navlabel{font-size:10px;letter-spacing:.16em;color:#7188a5;font-weight:800;padding:10px 10px 4px}.navbtn{display:flex;align-items:center;gap:11px;text-align:left;width:100%;padding:11px 12px;border-radius:11px;background:transparent;color:#a9bad0}.navbtn .ico{width:21px;text-align:center;font-size:16px}.navbtn.active,.navbtn:hover{background:#1b3552;color:white}.navbtn.active{box-shadow:inset 3px 0 var(--blue)}.sidebottom{margin-top:auto}.main{min-width:0;padding:22px clamp(14px,3vw,34px) 45px;max-width:1600px;width:100%;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.crumb{color:var(--muted);font-size:12px}.topright{display:flex;align-items:center;gap:9px}.avatar{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#2865a0,#42c7ac);display:grid;place-items:center;font-weight:900}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--blue);font-weight:900}.pagehead h1{font-size:clamp(24px,4vw,34px);margin:5px 0 3px;line-height:1.1}.sub{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}.col12{grid-column:span 12}.col8{grid-column:span 8}.col7{grid-column:span 7}.col6{grid-column:span 6}.col5{grid-column:span 5}.col4{grid-column:span 4}.card{background:linear-gradient(155deg,#152840,#101d30);border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:var(--shadow);min-width:0}.card h2{font-size:16px;margin:0 0 14px}.card h3{font-size:14px;margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:11px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:#0d1a2b;border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:27px;line-height:1.2;margin:6px 0}.stat .delta{font-size:11px;color:var(--green)}.btn{padding:10px 14px;border-radius:11px;background:var(--blue);color:#07172a;font-weight:850}.btn.secondary{background:#213a58;color:#e7f1ff;border:1px solid #365574}.btn.green{background:var(--green);color:#062319}.btn.orange{background:var(--orange);color:#2d1b05}.btn.danger{background:#512d3b;color:#ffdce1;border:1px solid #814455}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}.btn.smallbtn{padding:7px 10px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.field{display:grid;gap:5px;margin:9px 0}.field label{font-size:11px;color:var(--muted);font-weight:650}.field input,.field select,.field textarea,.search{width:100%;padding:11px 12px;border:1px solid var(--line);background:#091727;color:var(--txt);border-radius:10px;outline:none}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #55a8ff20}.field textarea{min-height:80px;resize:vertical}.formrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:13px;flex-wrap:wrap}.search{max-width:340px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:570px}th,td{text-align:left;padding:12px;border-bottom:1px solid #253951;font-size:12px}th{color:#8fa7c3;background:#0d1a2a;font-weight:750}tr:last-child td{border-bottom:0}.person{display:flex;align-items:center;gap:10px}.personpic{width:34px;height:34px;border-radius:11px;background:#24486a;display:grid;place-items:center;font-weight:850;color:#b8dcff}.tag{display:inline-flex;padding:4px 8px;border-radius:99px;background:#263e59;color:#c5dcf7;font-size:10px;white-space:nowrap}.tag.green{background:#164333;color:#8cf0c7}.tag.orange{background:#4b381d;color:#ffd391}.tag.red{background:#4c2934;color:#ffb8c1}.list{display:grid;gap:9px}.listitem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:#0c1a2b;border:1px solid var(--line);border-radius:12px}.listitem strong{display:block}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #38516d;border-radius:13px}.progress{height:7px;border-radius:20px;background:#25384f;overflow:hidden;margin:8px 0}.progress i{height:100%;display:block;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:20px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick button{background:#10243a;border:1px solid var(--line);padding:13px;border-radius:12px;text-align:left}.quick b{display:block;margin-top:6px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:74px;background:#0c1a2b;border:1px solid var(--line);border-radius:9px;padding:7px;font-size:11px}.day.today{border-color:var(--blue);background:#122d49}.day .event{display:block;background:#214c70;border-radius:5px;padding:3px;margin-top:5px;font-size:9px;overflow:hidden;text-overflow:ellipsis}.dayhead{text-align:center;color:var(--muted);font-size:10px;padding:5px}.modalback{position:fixed;inset:0;background:#020812d9;z-index:10;display:grid;place-items:center;padding:14px}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:#122238;border:1px solid #35516e;border-radius:18px;padding:20px;box-shadow:0 25px 80px #0009}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.modalhead h2{margin:0;font-size:18px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:20;background:#eff7ff;color:#102039;padding:11px 17px;border-radius:12px;font-weight:800;box-shadow:var(--shadow);max-width:90%;text-align:center}.hidden{display:none!important}.mobilehead{display:none}.note{padding:12px;border-left:3px solid var(--orange);background:#30281d;border-radius:8px;color:#ffdfb1;font-size:12px}.footer{text-align:center;color:#627a98;font-size:10px;margin-top:25px}
@media(max-width:900px){.shell{grid-template-columns:205px 1fr}.sidebar{padding:17px 9px}.col8,.col7{grid-column:span 12}.col5,.col4{grid-column:span 6}}
@media(max-width:650px){.shell{display:block}.sidebar{position:fixed;z-index:8;left:0;right:0;bottom:0;top:auto;height:auto;padding:7px 6px calc(7px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);display:block;background:#091625}.logo,.workspace,.navlabel,.sidebottom{display:none}.navgroup{display:flex;justify-content:space-around;gap:2px}.navbtn{display:flex;flex-direction:column;gap:2px;padding:7px 4px;font-size:9px;flex:1;text-align:center;justify-content:center}.navbtn .ico{font-size:17px}.main{padding:15px 12px 100px}.topbar{margin-bottom:18px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.col6,.col5,.col4{grid-column:span 12}.pagehead{display:block}.pagehead .actions{margin-top:12px}.quick{grid-template-columns:repeat(2,1fr)}.formrow{grid-template-columns:1fr}.card{padding:14px}.topright .crumb{display:none}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
<div class="logo">COACH <span>LINK</span></div>
<div class="workspace">РАБОЧЕЕ ПРОСТРАНСТВО<br><b style="color:#eaf3ff">Моя спортивная команда</b></div>
<nav class="navgroup" id="navigation">
<div class="navlabel">РАБОТА</div>
<button class="navbtn active" data-page="dashboard"><span class="ico">▦</span>Обзор</button>
<button class="navbtn" data-page="athletes"><span class="ico">♙</span>Спортсмены</button>
<button class="navbtn" data-page="training"><span class="ico">◈</span>Тренировки</button>
<button class="navbtn" data-page="calendar"><span class="ico">▦</span>Календарь</button>
<button class="navbtn" data-page="progress"><span class="ico">↗</span>Прогресс</button>
<div class="navlabel">ИНСТРУМЕНТЫ</div>
<button class="navbtn" data-page="library"><span class="ico">▤</span>Упражнения</button>
<button class="navbtn" data-page="messages"><span class="ico">✉</span>Объявления</button>
<button class="navbtn" data-page="settings"><span class="ico">⚙</span>Настройки</button>
</nav>
<div class="sidebottom small">COACH LINK 2.0<br>Локальная версия · данные в браузере</div>
</aside>
<main class="main">
<header class="topbar"><div><div class="crumb">COACH LINK / <span id="crumb">Обзор</span></div></div><div class="topright"><span class="tag green">● Система активна</span><div class="avatar" id="avatar">Т</div></div></header>
<div id="view"></div>
<div class="footer">COACH LINK 2.0 · Тренировочная платформа · Сохраняйте резервные копии регулярно</div>
</main>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<input type="file" id="importFile" accept="application/json" class="hidden">
<script>
const KEY='coach_link_2_full_v2';
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now()+Math.floor(Math.random()*1000);
const seed={
coach:{name:'Тренер',sport:'Эквилибр и цирковое искусство',email:'',phone:'',club:'Моя спортивная команда'},
athletes:[
{id:1,name:'Алексей',sport:'Общая физическая подготовка',birth:'',phone:'',email:'',level:'Начальный',notes:'',created:today()},
{id:2,name:'Мария',sport:'Эквилибр',birth:'',phone:'',email:'',level:'Средний',notes:'',created:today()},
{id:3,name:'Денис',sport:'Акробатика',birth:'',phone:'',email:'',level:'Продвинутый',notes:'',created:today()}],
tasks:[
{id:11,athleteId:1,athlete:'Алексей',name:'Приседания',date:today(),sets:3,reps:15,rest:60,duration:0,instructions:'Держи спину ровно, выполняй движение плавно.',status:'new',report:''},
{id:12,athleteId:2,athlete:'Мария',name:'Баланс на одной ноге',date:today(),sets:3,reps:30,rest:45,duration:0,instructions:'Сохраняй устойчивое положение корпуса.',status:'progress',report:''}],
exercises:[
{id:21,name:'Приседания',category:'ОФП',description:'Базовое силовое упражнение',sets:3,reps:15,rest:60},
{id:22,name:'Планка',category:'ОФП',description:'Удержание прямой линии тела',sets:3,reps:30,rest:45},
{id:23,name:'Баланс на одной ноге',category:'Эквилибр',description:'Развитие устойчивости и контроля',sets:3,reps:30,rest:45},
{id:24,name:'Растяжка плеч',category:'Разминка',description:'Мягкая динамическая мобилизация',sets:2,reps:10,rest:20}],
events:[],posts:[{id:31,date:today(),text:'Добро пожаловать в COACH LINK! Здесь будут важные объявления команды.'}],settings:{theme:'dark',notifications:true,autosave:true}
};
let db=load(),page='dashboard',query='',toastTimer;
function load(){try{return {...structuredClone(seed),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function msg(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2300)}
function setPage(p){page=p;query='';document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('crumb').textContent=({dashboard:'Обзор',athletes:'Спортсмены',training:'Тренировки',calendar:'Календарь',progress:'Прогресс',library:'Упражнения',messages:'Объявления',settings:'Настройки'})[p];render()}
$('navigation').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});
function head(kicker,title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action?`<div class="actions">${action}</div>`:''}</div>`}
function btn(label,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}
function stat(label,value,delta=''){return `<div class="stat"><span class="small">${label}</span><b>${value}</b>${delta?`<span class="delta">${delta}</span>`:''}</div>`}
function empty(t){return `<div class="empty">${t}</div>`}
function athleteName(id){return db.athletes.find(a=>a.id==id)?.name||'Неизвестный спортсмен'}
function statusTag(s){let map={new:['Новое',''],progress:['Выполняется','orange'],done:['Завершено','green'],cancelled:['Отменено','red']};let v=map[s]||map.new;return `<span class="tag ${v[1]}">${v[0]}</span>`}
function render(){ $('avatar').textContent=(db.coach.name||'Т').trim().slice(0,1).toUpperCase();let views={dashboard:dashboard,athletes:athletes,training:training,calendar:calendar,progress:progress,library:library,messages:messages,settings:settings};$('view').innerHTML=views[page](); }
function dashboard(){
let active=db.tasks.filter(t=>!['done','cancelled'].includes(t.status)).length,done=db.tasks.filter(t=>t.status==='done').length,todayTasks=db.tasks.filter(t=>t.date===today());
return head('ПАНЕЛЬ УПРАВЛЕНИЯ','Добро пожаловать, '+esc(db.coach.name||'тренер'),'Управляйте командой, планируйте занятия и отслеживайте результаты.',btn('＋ Новое задание','openTask()'))+
`<div class="stats">${stat('Спортсмены',db.athletes.length,'В вашей команде')}${stat('Активные задания',active,'Требуют внимания')}${stat('Завершено',done,'За всё время')}${stat('На сегодня',todayTasks.length,'Запланировано заданий')}</div>
<div class="grid" style="margin-top:14px"><section class="card col7"><h2>Задания на сегодня</h2>${todayTasks.length?`<div class="list">${todayTasks.map(t=>`<div class="listitem"><div><strong>${esc(t.name)}</strong><span class="small">${esc(t.athlete)} · ${t.sets} × ${t.reps}</span></div>${statusTag(t.status)}</div>`).join('')}</div>`:empty('На сегодня заданий нет. Создайте первое занятие.')}</section>
<section class="card col5"><h2>Быстрые действия</h2><div class="quick"><button onclick="openAthlete()"><span>♙</span><b>Добавить спортсмена</b></button><button onclick="openTask()"><span>◈</span><b>Создать тренировку</b></button><button onclick="setPage('calendar')"><span>▦</span><b>Открыть календарь</b></button><button onclick="setPage('library')"><span>▤</span><b>Библиотека</b></button></div></section>
<section class="card col6"><h2>Команда</h2>${db.athletes.slice(0,5).map(a=>`<div class="listitem"><div class="person"><div class="personpic">${esc(a.name.slice(0,1).toUpperCase())}</div><div><strong>${esc(a.name)}</strong><span class="small">${esc(a.sport||'Спортсмен')}</span></div></div><span class="tag">${db.tasks.filter(t=>t.athleteId==a.id&&t.status==='done').length} выполнено</span></div>`).join('')||empty('Добавьте первого спортсмена')}${btn('Все спортсмены →',"setPage('athletes')",'secondary smallbtn')}</section>
<section class="card col6"><h2>Последние объявления</h2>${db.posts.slice(0,3).map(p=>`<div class="listitem"><div><strong>${esc(p.text)}</strong><span class="small">${esc(p.date)}</span></div></div>`).join('')||empty('Объявлений пока нет')}${btn('Перейти к объявлениям →',"setPage('messages')",'secondary smallbtn')}</section></div>`;
}
function athletes(){let list=db.athletes.filter(a=>(a.name+' '+a.sport+' '+a.level).toLowerCase().includes(query.toLowerCase()));return head('КОМАНДА','Спортсмены','Профили, контакты, специализация и индивидуальная история.',btn('＋ Добавить спортсмена','openAthlete()'))+
`<section class="card"><div class="toolbar"><h2 style="margin:0">Список спортсменов · ${db.athletes.length}</h2><input class="search" placeholder="Поиск по имени или направлению..." value="${esc(query)}" oninput="query=this.value;render()"></div>
${list.length?`<div class="tablewrap"><table><thead><tr><th>Спортсмен</th><th>Направление</th><th>Уровень</th><th>Задания</th><th>Действия</th></tr></thead><tbody>${list.map(a=>`<tr><td><div class="person"><div class="personpic">${esc(a.name.slice(0,1).toUpperCase())}</div><div><b>${esc(a.name)}</b><div class="small">${esc(a.phone||a.email||'Контакты не указаны')}</div></div></div></td><td>${esc(a.sport||'—')}</td><td><span class="tag">${esc(a.level||'Не указан')}</span></td><td>${db.tasks.filter(t=>t.athleteId==a.id).length}</td><td><div class="actions"><button class="btn secondary smallbtn" onclick="openAthlete(${a.id})">Открыть</button><button class="btn ghost smallbtn" onclick="deleteAthlete(${a.id})">Удалить</button></div></td></tr>`).join('')}</tbody></table></div>`:empty('Спортсмены не найдены')}</section>`}
function openAthlete(id=null){let a=db.athletes.find(x=>x.id===id)||{name:'',sport:'',birth:'',phone:'',email:'',level:'Начальный',notes:''};modal('Профиль спортсмена',`<form onsubmit="saveAthlete(event,${id||'null'})"><div class="formrow"><div class="field"><label>Имя и фамилия *</label><input name="name" required value="${esc(a.name)}" placeholder="Введите имя вручную"></div><div class="field"><label>Спортивное направление</label><input name="sport" value="${esc(a.sport)}" placeholder="Например, эквилибр"></div></div><div class="formrow"><div class="field"><label>Дата рождения</label><input name="birth" type="date" value="${esc(a.birth)}"></div><div class="field"><label>Уровень подготовки</label><select name="level">${['Начальный','Средний','Продвинутый','Профессиональный'].map(v=>`<option ${a.level===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="formrow"><div class="field"><label>Телефон</label><input name="phone" value="${esc(a.phone)}"></div><div class="field"><label>Email</label><input name="email" type="email" value="${esc(a.email)}"></div></div><div class="field"><label>Заметки тренера</label><textarea name="notes">${esc(a.notes)}</textarea></div><div class="actions"><button class="btn">Сохранить профиль</button><button type="button" class="btn ghost" onclick="closeModal()">Отмена</button></div></form>`)}
function saveAthlete(e,id){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(id){Object.assign(db.athletes.find(a=>a.id===id),d)}else db.athletes.unshift({id:uid(),...d,created:today()});save();closeModal();render();msg('Профиль спортсмена сохранён')}
function deleteAthlete(id){let a=db.athletes.find(x=>x.id===id);if(!confirm(`Удалить профиль «${a.name}»? Задания останутся в истории.`))return;db.athletes=db.athletes.filter(x=>x.id!==id);save();render();msg('Профиль удалён')}
function training(){let list=db.tasks.filter(t=>(t.name+' '+t.athlete+' '+t.status).toLowerCase().includes(query.toLowerCase()));return head('ТРЕНИРОВОЧНЫЙ ПРОЦЕСС','Тренировки и задания','Создавайте индивидуальные планы и контролируйте выполнение.',btn('＋ Создать задание','openTask()'))+
`<section class="card"><div class="toolbar"><h2 style="margin:0">Все задания · ${db.tasks.length}</h2><input class="search" placeholder="Поиск задания или спортсмена..." value="${esc(query)}" oninput="query=this.value;render()"></div>${list.length?`<div class="list">${list.map(t=>`<div class="listitem"><div style="min-width:0"><strong>${esc(t.name)}</strong><span class="small">${esc(t.athlete)} · ${esc(t.date)} · ${t.sets} подхода × ${t.reps}</span><div style="margin-top:6px">${statusTag(t.status)}</div>${t.report?`<div class="small">Отчёт: ${esc(t.report)}</div>`:''}</div><div class="actions"><button class="btn secondary smallbtn" onclick="openTask(${t.id})">Изменить</button><button class="btn ghost smallbtn" onclick="cycleTask(${t.id})">Статус</button><button class="btn ghost smallbtn" onclick="deleteTask(${t.id})">×</button></div></div>`).join('')}</div>`:empty('Заданий пока нет. Создайте первую тренировку.')}</section>`}
function openTask(id=null){let t=db.tasks.find(x=>x.id===id)||{athleteId:'',name:'',date:today(),sets:3,reps:10,rest:60,instructions:'',status:'new'};modal(id?'Редактирование задания':'Конструктор тренировки',`<form onsubmit="saveTask(event,${id||'null'})"><div class="formrow"><div class="field"><label>Имя спортсмена *</label><input name="athleteName" list="athleteOptions" required autocomplete="off" value="${esc(t.athlete||'')}" placeholder="Введите имя вручную"><datalist id="athleteOptions">${db.athletes.map(a=>`<option value="${esc(a.name)}">`).join('')}</datalist></div><div class="field"><label>Название упражнения *</label><input name="name" required list="exerciseOptions" value="${esc(t.name)}" placeholder="Введите вручную"><datalist id="exerciseOptions">${db.exercises.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist></div></div><div class="formrow"><div class="field"><label>Дата тренировки</label><input name="date" type="date" value="${esc(t.date)}" required></div><div class="field"><label>Статус</label><select name="status">${[['new','Новое'],['progress','Выполняется'],['done','Завершено'],['cancelled','Отменено']].map(x=>`<option value="${x[0]}" ${t.status===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div></div><div class="formrow"><div class="field"><label>Подходы</label><input name="sets" type="number" min="1" max="50" value="${t.sets}" required></div><div class="field"><label>Повторения / секунды</label><input name="reps" type="number" min="1" max="10000" value="${t.reps}" required></div></div><div class="formrow"><div class="field"><label>Отдых между подходами, сек.</label><input name="rest" type="number" min="0" max="3600" value="${t.rest}"></div><div class="field"><label>Ссылка на видео</label><input name="video" type="url" value="${esc(t.video||'')}" placeholder="https://..."></div></div><div class="field"><label>Техника и рекомендации</label><textarea name="instructions">${esc(t.instructions)}</textarea></div><div class="field"><label>Отчёт спортсмена</label><textarea name="report">${esc(t.report||'')}</textarea></div><div class="actions"><button class="btn">Сохранить задание</button><button type="button" class="btn ghost" onclick="closeModal()">Отмена</button></div></form>`)}
function saveTask(e,id){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let athleteName=(d.athleteName||'').trim();if(!athleteName){msg('Введите имя спортсмена');return}let a=db.athletes.find(x=>x.name.trim().toLowerCase()===athleteName.toLowerCase());if(!a){a={id:uid(),name:athleteName,sport:'',birth:'',phone:'',email:'',level:'Начальный',notes:'',created:today()};db.athletes.unshift(a)}Object.assign(d,{athleteId:a.id,athlete:a.name,sets:+d.sets,reps:+d.reps,rest:+d.rest});delete d.athleteName;if(id)Object.assign(db.tasks.find(t=>t.id===id),d);else db.tasks.unshift({id:uid(),...d,duration:0});save();closeModal();render();msg('Задание сохранено для '+a.name)}
function cycleTask(id){let t=db.tasks.find(x=>x.id===id);t.status=({new:'progress',progress:'done',done:'new',cancelled:'new'})[t.status]||'new';save();render();msg('Статус обновлён')}
function deleteTask(id){if(!confirm('Удалить задание?'))return;db.tasks=db.tasks.filter(t=>t.id!==id);save();render()}
function calendar(){let d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),cells='';let names=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];for(let n of names)cells+=`<div class="dayhead">${n}</div>`;for(let i=0;i<offset;i++)cells+='<div></div>';for(let n=1;n<=days;n++){let date=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,ev=db.tasks.filter(t=>t.date===date);cells+=`<div class="day ${date===today()?'today':''}"><b>${n}</b>${ev.slice(0,2).map(t=>`<span class="event" title="${esc(t.athlete+' · '+t.name)}">${esc(t.athlete)} · ${esc(t.name)}</span>`).join('')}${ev.length>2?`<span class="small">+${ev.length-2}</span>`:''}</div>`}return head('ПЛАНИРОВАНИЕ','Календарь тренировок','Месячный обзор запланированных заданий и занятий.')+`<section class="card"><div class="toolbar"><h2 style="margin:0">${first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</h2>${btn('＋ Запланировать','openTask()')}</div><div class="calendar">${cells}</div></section><section class="card" style="margin-top:14px"><h2>Ближайшие тренировки</h2>${db.tasks.filter(t=>t.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8).map(t=>`<div class="listitem"><div><strong>${esc(t.name)}</strong><span class="small">${esc(t.date)} · ${esc(t.athlete)}</span></div>${statusTag(t.status)}</div>`).join('')||empty('Нет запланированных тренировок')}</section>`}
function progress(){let done=db.tasks.filter(t=>t.status==='done').length,total=db.tasks.length;return head('АНАЛИТИКА','Прогресс спортсменов','Отслеживайте выполнение тренировочного плана и индивидуальную динамику.')+`<div class="stats">${stat('Всего заданий',total)}${stat('Завершено',done)}${stat('Выполнение',total?Math.round(done/total*100)+'%':'0%')}${stat('Спортсмены',db.athletes.length)}</div><section class="card" style="margin-top:14px"><h2>Индивидуальные показатели</h2>${db.athletes.map(a=>{let ts=db.tasks.filter(t=>t.athleteId==a.id),dn=ts.filter(t=>t.status==='done').length,p=ts.length?Math.round(dn/ts.length*100):0;return `<div style="margin:16px 0"><div class="toolbar" style="margin:0"><b>${esc(a.name)}</b><span class="small">${dn} из ${ts.length} заданий · ${p}%</span></div><div class="progress"><i style="width:${p}%"></i></div><span class="small">${esc(a.sport||'Направление не указано')}</span></div>`}).join('')||empty('Добавьте спортсменов для просмотра прогресса')}</section><div class="note" style="margin-top:14px">Показатели рассчитываются по заданиям, сохранённым в этой версии приложения. Для медицинских и соревновательных выводов необходимы отдельные проверенные протоколы измерений.</div>`}
function library(){let list=db.exercises.filter(x=>(x.name+' '+x.category).toLowerCase().includes(query.toLowerCase()));return head('МЕТОДИЧЕСКАЯ БАЗА','Библиотека упражнений','Создавайте собственную базу элементов, используйте их в заданиях.',btn('＋ Добавить упражнение','openExercise()'))+`<section class="card"><div class="toolbar"><h2 style="margin:0">Упражнения · ${db.exercises.length}</h2><input class="search" placeholder="Поиск..." value="${esc(query)}" oninput="query=this.value;render()"></div>${list.length?`<div class="grid">${list.map(x=>`<div class="card col4" style="background:#0d1a2b;box-shadow:none"><span class="tag">${esc(x.category)}</span><h3 style="margin-top:10px">${esc(x.name)}</h3><p class="small">${esc(x.description)}</p><div class="small">${x.sets} подхода · ${x.reps} повторений · отдых ${x.rest} сек.</div><div class="actions" style="margin-top:12px"><button class="btn secondary smallbtn" onclick="openExercise(${x.id})">Изменить</button><button class="btn ghost smallbtn" onclick="deleteExercise(${x.id})">Удалить</button></div></div>`).join('')}</div>`:empty('Упражнения не найдены')}</section>`}
function openExercise(id=null){let x=db.exercises.find(a=>a.id===id)||{name:'',category:'ОФП',description:'',sets:3,reps:10,rest:60};modal('Упражнение',`<form onsubmit="saveExercise(event,${id||'null'})"><div class="field"><label>Название *</label><input name="name" required value="${esc(x.name)}"></div><div class="formrow"><div class="field"><label>Категория</label><select name="category">${['ОФП','Эквилибр','Акробатика','Растяжка','Разминка','Силовая подготовка','Баланс','Другое'].map(c=>`<option ${x.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Подходы</label><input name="sets" type="number" min="1" value="${x.sets}"></div></div><div class="formrow"><div class="field"><label>Повторения / секунды</label><input name="reps" type="number" min="1" value="${x.reps}"></div><div class="field"><label>Отдых, сек.</label><input name="rest" type="number" min="0" value="${x.rest}"></div></div><div class="field"><label>Описание и техника</label><textarea name="description">${esc(x.description)}</textarea></div><div class="actions"><button class="btn">Сохранить</button><button type="button" class="btn ghost" onclick="closeModal()">Отмена</button></div></form>`)}
function saveExercise(e,id){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.sets=+d.sets;d.reps=+d.reps;d.rest=+d.rest;if(id)Object.assign(db.exercises.find(x=>x.id===id),d);else db.exercises.unshift({id:uid(),...d});save();closeModal();render();msg('Упражнение сохранено')}
function deleteExercise(id){if(!confirm('Удалить упражнение из библиотеки?'))return;db.exercises=db.exercises.filter(x=>x.id!==id);save();render()}
function messages(){return head('КОММУНИКАЦИЯ','Объявления команды','Публикуйте расписание, организационные сообщения и рекомендации.',btn('＋ Новое объявление','openPost()'))+`<section class="card"><h2>Лента объявлений</h2>${db.posts.map(p=>`<div class="listitem"><div><strong>${esc(p.text)}</strong><span class="small">${esc(p.date)}</span></div><button class="btn ghost smallbtn" onclick="deletePost(${p.id})">Удалить</button></div>`).join('')||empty('Пока нет объявлений')}</section><div class="note" style="margin-top:14px">В текущей автономной версии объявления доступны в этом браузере. Для доставки сообщений на устройства спортсменов потребуется подключение серверной авторизации и push/SMS-сервиса.</div>`}
function openPost(){modal('Новое объявление',`<form onsubmit="savePost(event)"><div class="field"><label>Текст объявления *</label><textarea name="text" required placeholder="Напишите сообщение команде..."></textarea></div><div class="actions"><button class="btn">Опубликовать</button><button type="button" class="btn ghost" onclick="closeModal()">Отмена</button></div></form>`)}
function savePost(e){e.preventDefault();let textv=new FormData(e.target).get('text').trim();db.posts.unshift({id:uid(),date:today(),text:textv});save();closeModal();render();msg('Объявление опубликовано')}
function deletePost(id){db.posts=db.posts.filter(p=>p.id!==id);save();render()}
function settings(){return head('УПРАВЛЕНИЕ','Настройки системы','Профиль тренера, параметры приложения и безопасность данных.')+`<div class="grid"><section class="card col6"><h2>Профиль тренера</h2><form onsubmit="saveCoach(event)"><div class="field"><label>Имя тренера</label><input name="name" value="${esc(db.coach.name)}" required></div><div class="field"><label>Специализация</label><input name="sport" value="${esc(db.coach.sport)}"></div><div class="field"><label>Спортивная организация / клуб</label><input name="club" value="${esc(db.coach.club)}"></div><div class="formrow"><div class="field"><label>Телефон</label><input name="phone" value="${esc(db.coach.phone)}"></div><div class="field"><label>Email</label><input name="email" type="email" value="${esc(db.coach.email)}"></div></div><button class="btn">Сохранить профиль</button></form></section><section class="card col6"><h2>Данные и резервное копирование</h2><p class="small">Создайте резервную копию всех спортсменов, заданий, упражнений и настроек в JSON-файле.</p><div class="actions">${btn('↓ Экспортировать данные','exportData()','green')}${btn('↑ Импортировать копию',"$('importFile').click()",'secondary')}</div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>Состояние хранилища</h3><div class="listitem"><span>Локальная база браузера</span><span class="tag green">Активна</span></div><div class="listitem"><span>Спортсменов</span><b>${db.athletes.length}</b></div><div class="listitem"><span>Заданий</span><b>${db.tasks.length}</b></div><div class="listitem"><span>Упражнений</span><b>${db.exercises.length}</b></div>${btn('Очистить все данные','resetData()','danger smallbtn')}</section><section class="card col12"><h2>Параметры приложения</h2><label style="display:flex;gap:10px;align-items:center"><input style="width:auto" type="checkbox" ${db.settings.notifications?'checked':''} onchange="db.settings.notifications=this.checked;save();msg('Настройка сохранена')"> Показывать системные уведомления внутри приложения</label><p class="small" style="margin-top:12px">Автосохранение включено по умолчанию. Все изменения записываются в локальное хранилище браузера.</p><div class="note">Важно: это полноценный автономный прототип. Данные не синхронизируются между разными устройствами и не являются серверной базой. Для реального многопользовательского сервиса следующим техническим этапом будет подключение Supabase, разграничение ролей, защищённая авторизация и облачные резервные копии.</div></section></div>`}
function saveCoach(e){e.preventDefault();db.coach=Object.fromEntries(new FormData(e.target));save();render();msg('Профиль тренера обновлён')}
function modal(title,body){$('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="btn ghost smallbtn" onclick="closeModal()">✕</button></div><div style="margin-top:14px">${body}</div></div></div>`}
function closeModal(){$('modalRoot').innerHTML=''}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='coach-link-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url);msg('Резервная копия подготовлена')}
$('importFile').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.athletes||!x.tasks||!x.exercises)throw Error();if(!confirm('Заменить текущие данные импортированной копией?'))return;db={...structuredClone(seed),...x};save();render();msg('Данные восстановлены')}catch(err){msg('Файл не распознан как резервная копия COACH LINK')}e.target.value=''};r.readAsText(f)});
function resetData(){if(!confirm('ВНИМАНИЕ: удалить все локальные данные и восстановить демо-пример? Сначала экспортируйте резервную копию.'))return;db=structuredClone(seed);save();render();msg('Демо-данные восстановлены')}
render();
</script>
</body></html>
